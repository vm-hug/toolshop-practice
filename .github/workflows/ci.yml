# It is called ci.yml.todo until then so GitHub does not try to run a half-written workflow.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  BASE_URL: http://localhost:4200
  API_URL: http://localhost:8091
  ROUTE_PREFIX: ""
  GITHUB_API_URL: https://api.github.com
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test:
    name: test (${{ matrix.browser }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v4

      - name: Start Toolshop containers
        run: docker compose -f toolshop/docker-compose.yml up -d

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install browser
        run: python -m playwright install --with-deps ${{ matrix.browser }}

      - name: Wait for Toolshop and load seed data
        run: bash toolshop/start.sh

      - name: Run tests
        run: >
          pytest -m smoke --browser ${{ matrix.browser }}
          -n 2 --reruns 1
          --tracing retain-on-failure
          --screenshot only-on-failure
          --html=report.html --self-contained-html

      - name: Upload report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.browser }}
          path: |
            report.html
            test-results/
          retention-days: 7
